spring:
  datasource:
    url: jdbc:mysql://mysql:3306/userdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9082

  management:
    info:
      env:
        enabled: true
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - metrics

    endpoint:
      health:
        probes:
          enabled: true
        show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true
