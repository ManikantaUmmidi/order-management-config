spring:
  datasource:
    url: jdbc:mysql://localhost:3306/product_service
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9084

  management:
    info:
      env:
        enabled: true
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - metrics

    endpoint:
      health:
        probes:
          enabled: true
        show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true